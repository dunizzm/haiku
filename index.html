  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b08" />

  <title>VECTRA — Проверка</title>
  <style>
:root{
  color-scheme:dark; --bg:#080b08; --panel:#111611; --panel-2:#171d16;
  --line:#30382e; --line-soft:#222c21; --accent:#b6ff40; --accent-bright:#ceff7b;
  --text:#f5f8f1; --muted:#8f998b; --subtle:#667361; --error:#ff907d;
  font-family:Inter,"SF Pro Display",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-synthesis:none;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{min-height:100dvh;margin:0;color:var(--text);overflow-x:hidden;
  background:radial-gradient(ellipse 75% 70% at 50% 45%, #142010 0%,#0c120b 36%,#080b08 75%);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
 background-image:linear-gradient(#a3eb4920 1px,transparent 1px),linear-gradient(90deg,#a3eb4920 1px,transparent 1px);
 background-size:58px 58px;mask-image:radial-gradient(ellipse at 50% 50%,#000,transparent 70%)}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.layout{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:28px 16px 48px;isolation:isolate}
.captcha{width:min(100%,380px);position:relative;animation:appear .58s cubic-bezier(.2,.8,.2,1) both}
.compact{width:100%;min-height:86px;display:flex;align-items:center;gap:15px;padding:15px 17px;
 border:1px solid #3c4936;border-radius:11px;background:linear-gradient(140deg,#1a2119,#10160f 65%);
 box-shadow:0 14px 56px #0007,0 0 0 1px #b6ff4006 inset;position:relative;overflow:hidden}
.compact::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--accent);box-shadow:0 0 19px var(--accent);opacity:.65}
.compact::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 27%,#b6ff4008 50%,transparent 70%);
 transform:translateX(-130%);animation:bar-shine 7s ease-in-out 2s infinite}
.check-control{width:32px;height:32px;display:grid;place-items:center;padding:0;border:1.5px solid #64715e;border-radius:5px;
 background:#0a0e09;cursor:pointer;position:relative;flex:0 0 auto;transition:border-color .23s,background .23s,box-shadow .23s,transform .23s;z-index:1}
.check-control:hover{border-color:var(--accent);box-shadow:0 0 18px #b6ff401d;transform:scale(1.05)}
.check-control:active{transform:scale(.94)}
.check-empty{width:100%;height:100%;position:absolute;inset:0}
.check-loader,.check-success{opacity:0;position:absolute;transition:opacity .2s,transform .35s}
.check-loader{width:21px;height:21px;border:2px solid #52633f;border-top-color:var(--accent);border-radius:50%;animation:rotate .8s linear infinite}
.check-success{height:23px;width:23px;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform:scale(.4)}
.captcha.is-busy .check-control{border-color:var(--accent);cursor:wait}
.captcha.is-busy .check-loader{opacity:1}
.captcha.is-verified .check-control{border-color:#9cec36;background:#b6ff4014;box-shadow:0 0 18px #b6ff4030;cursor:default}
.captcha.is-verified .check-success{opacity:1;transform:scale(1);animation:tick-in .45s cubic-bezier(.18,1.6,.4,1) both}
.compact-text{flex:1;min-width:0;background:none;border:0;padding:9px 0;color:var(--text);font-size:15px;font-weight:560;
 text-align:left;cursor:pointer;letter-spacing:-.02em;z-index:1;transition:color .2s}
.compact-text:hover{color:var(--accent-bright)}
.captcha.is-verified .compact-text{color:var(--accent);cursor:default}
.brand{display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;z-index:1;flex:0 0 62px;user-select:none}
.brand svg{width:29px;height:29px;margin-bottom:2px;filter:drop-shadow(0 0 7px #a5ff4138);animation:brand-hover 5s ease-in-out infinite}
.brand-outline{stroke:var(--accent);stroke-width:1.65;stroke-linejoin:round}
.brand-v{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.brand strong{font-size:10px;line-height:1.15;letter-spacing:.14em;font-weight:800}
.brand small{font-size:8px;color:var(--subtle)}
.challenge{margin-top:10px;border-radius:12px;overflow:hidden;background:#111710;border:1px solid #364631;
 box-shadow:0 24px 78px #0009,0 0 48px #a7ff1207;
 opacity:0;transform:translateY(-10px) scale(.985);max-height:0;visibility:hidden;pointer-events:none;
 transition:opacity .25s,transform .36s cubic-bezier(.2,.9,.2,1),max-height .38s,visibility .38s}
.challenge.open{max-height:700px;opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1)}
.challenge-head{background:linear-gradient(125deg,#b7ff3b,#a4ed2b 70%,#81cf18);color:#0c1506;padding:20px 20px 17px;position:relative;overflow:hidden}
.challenge-head::after{content:"";position:absolute;width:230px;height:230px;border:1px solid #14270022;border-radius:50%;right:-98px;top:-122px;box-shadow:0 0 0 24px #2545000a,0 0 0 49px #2545000b;pointer-events:none}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.eyebrow{font-size:9.8px;font-weight:830;letter-spacing:.105em;line-height:1.4}
.stage-indicator{font-size:12px;letter-spacing:.02em;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-separator{opacity:.4;margin:0 3px}
.target{font-size:clamp(27px,7vw,37px);line-height:1.07;letter-spacing:-.055em;font-weight:850;margin:11px 0 5px;position:relative;z-index:1;animation:target-in .34s cubic-bezier(.1,1,.2,1) both}
.head-note{font-size:11px;opacity:.76;margin:0;line-height:1.4;position:relative;z-index:1}
.stage-rail{height:3px;border-radius:9px;background:#19280a2e;margin-top:18px;overflow:hidden;position:relative;z-index:1}
.stage-rail span{display:block;height:100%;width:50%;border-radius:inherit;background:#152908;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.tiles-wrap{position:relative;padding:9px 9px 8px;background:var(--panel)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tile{aspect-ratio:1;min-width:0;border:1px solid #344030;border-radius:8px;background:#1b2419;
 color:#dae3d4;position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden;
 transition:transform .22s cubic-bezier(.2,1,.2,1),border-color .2s,background .22s,box-shadow .24s;
 animation:tile-in .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--tile-index)*34ms)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 20%,#b6ff400d 50%,transparent 85%);transform:translateX(-130%);transition:transform .55s}
.tile:hover{background:#283526;border-color:#66834f;transform:translateY(-2px);box-shadow:0 4px 19px #0006}
.tile:hover::after{transform:translateX(130%)}
.tile:active{transform:scale(.94)}
.tile.selected{background:linear-gradient(135deg,#29451c,#1e3216);border-color:var(--accent);box-shadow:inset 0 0 0 1px #b6ff4068,0 0 18px #b6ff401a}
.tile.selected:hover{transform:translateY(-1px)}
.tile svg.icon{width:54%;height:54%;max-width:57px;max-height:57px;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;fill:none;
 transition:transform .33s cubic-bezier(.18,1.6,.4,1),color .18s;filter:drop-shadow(0 2px 4px #0003)}
.tile.selected svg.icon{color:var(--accent);transform:scale(.9)}
.tile-check{position:absolute;top:7px;right:7px;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;
 background:var(--accent);opacity:0;transform:scale(.25) rotate(-50deg);transition:transform .27s cubic-bezier(.18,1.6,.4,1),opacity .2s}
.tile.selected .tile-check{opacity:1;transform:scale(1) rotate(0)}
.tile-check svg{height:13px;width:13px;fill:none;stroke:#142108;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tile-nr{position:absolute;bottom:7px;left:8px;color:#728168;font-size:9px;font-weight:700;letter-spacing:.02em;transition:color .2s}
.tile.selected .tile-nr{color:#b7ff3b85}
.tile:disabled{cursor:wait}
.tiles-wrap.is-error .tiles{animation:shake .32s ease-in-out both}
.transition-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 background:#10180ef2;backdrop-filter:blur(7px);opacity:0;visibility:hidden;transform:scale(1.03);transition:opacity .26s,transform .3s,visibility .26s;pointer-events:none;z-index:3}
.transition-overlay.visible{opacity:1;visibility:visible;transform:scale(1)}
.transition-overlay svg{width:64px;height:64px;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 16px #b6ff4050)}
.transition-overlay.visible svg{animation:result-pop .48s cubic-bezier(.2,1.6,.2,1) both}
.transition-overlay circle{stroke:#b6ff403a;stroke-width:1.3}
.transition-overlay span{font-size:12px;font-weight:750;color:var(--accent);letter-spacing:.025em}
.challenge-foot{display:flex;align-items:center;gap:9px;min-height:66px;padding:11px 12px;border-top:1px solid var(--line-soft);background:#141b13}
.refresh{width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:7px;
 color:#85927b;flex:0 0 auto;cursor:pointer;transition:background .2s,color .2s,transform .3s,border-color .2s}
.refresh:hover{background:#253222;border-color:#42543b;color:var(--accent);transform:rotate(25deg)}
.refresh:active{transform:rotate(140deg)}
.refresh svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.refresh:disabled{opacity:.4;cursor:wait}
.feedback{font-size:11px;line-height:1.35;color:var(--muted);min-width:0;flex:1;animation:feedback-in .2s ease both}
.feedback.error{color:var(--error)}
.verify{min-width:116px;min-height:39px;border:0;border-radius:7px;background:var(--accent);color:#0c1506;padding:0 13px;
 display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:850;letter-spacing:.015em;
 cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,background .2s,box-shadow .22s,opacity .2s}
.verify:hover:not(:disabled){background:var(--accent-bright);box-shadow:0 0 27px #b6ff4045;transform:translateY(-1px)}
.verify:active:not(:disabled){transform:scale(.97)}
.verify:disabled{opacity:.45;cursor:not-allowed}
.verify-arrow{width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.verify:hover:not(:disabled) .verify-arrow{transform:translateX(3px)}
.verify-spinner{display:none;width:17px;height:17px;border:2px solid #0c15063c;border-top-color:#0c1506;border-radius:50%;animation:rotate .65s linear infinite}
.verify.loading .verify-spinner{display:block}
.verify.loading .verify-arrow{display:none}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tile-in{from{opacity:0;transform:translateY(9px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes target-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes tick-in{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes result-pop{from{transform:scale(.35);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes feedback-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes bar-shine{0%,55%,100%{transform:translateX(-130%)}75%{transform:translateX(130%)}}
@keyframes brand-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media(max-width:390px){.compact{padding:13px 12px;gap:11px}.challenge-head{padding:18px 15px 15px}.tiles{gap:5px}.tiles-wrap{padding:7px}.eyebrow{font-size:9px}.target{font-size:30px}.tile{border-radius:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>

    ['book','книги','<path d="M12 5c-3-2-7-2-10-1v16c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v16"/>'],
    ['lightbulb','лампочки','<path d="M8 17c0-3-4-5-4-9a8 8 0 0 1 16 0c0 4-4 6-4 9zM8 17h8m-7 3h6m-5 2h4"/>'],
    ['mountain','горы','<path d="m2 21 8-16 5 9 2-4 5 11zM7 11l3 2 2-2"/>'],
    ['paw','лапы','<path d="M12 13c-4-4-7 1-8 4s1 5 4 4l4-2 4 2c3 1 5-1 4-4s-4-8-8-4Z"/><ellipse cx="5" cy="9" rx="2" ry="3"/><ellipse cx="10" cy="5" rx="2" ry="3"/><ellipse cx="16" cy="5" rx="2" ry="3"/><ellipse cx="21" cy="9" rx="2" ry="3"/>'],
    ['sailboat','парусники','<path d="M12 2v15M11 3 4 16h7V3Zm2 4 6 9h-6zM2 19h20l-3 3H5z"/>'],
    ['leaf','листья','<path d="M20 3C8 3 3 8 3 15c0 8 11 9 15 1 2-4 2-8 2-13ZM4 21c5-7 9-10 14-13"/>']
  ].map(([id,label,path]) => ({id,label,path}));
  const api={ICONS};
  if(typeof module!=='undefined' && module.exports)module.exports=api;
  if(root)root.VECTRA_ICONS=ICONS;
})(typeof window !== 'undefined' ? window : null);

</script>
  
</head>
<body>
  <main class="layout" aria-label="VECTRA CAPTCHA">
    <div class="captcha" id="captcha">
      <section class="compact" aria-label="Проверка пользователя">
        <button class="check-control" id="start" type="button" aria-label="Начать проверку" aria-expanded="false" aria-controls="challenge">
          <span class="check-empty" aria-hidden="true"></span>
          <span class="check-loader" aria-hidden="true"></span>
          <svg class="check-success" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="m5 14 6 6L23 8"/></svg>
        </button>
        <button type="button" id="start-label" class="compact-text" aria-controls="challenge" aria-expanded="false">Я человек</button>
        <div class="brand" aria-label="VECTRA">
          <svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <path d="m18 2 15 8.5v15L18 34 3 25.5v-15L18 2Z" class="brand-outline"/>
            <path d="m10 13 8 12 8-12" class="brand-v"/>
          </svg>
          <strong>VECTRA</strong>
          <small>Verification</small>
        </div>
      </section>

      <section class="challenge" id="challenge" aria-label="Выберите изображения" aria-hidden="true" inert>
        <div class="challenge-head">
          <div class="head-top">
            <span class="eyebrow">ВЫБЕРИТЕ ВСЕ ИЗОБРАЖЕНИЯ</span>
            <div class="stage-indicator"><span id="stage-number">01</span><span class="stage-separator">/</span>02</div>
          </div>
          <h1 class="target" id="target">молнии</h1>
          <p class="head-note">Затем нажмите «Проверить»</p>
          <div class="stage-rail" aria-hidden="true"><span id="stage-rail-fill"></span></div>
        </div>
        <div class="tiles-wrap" id="tiles-wrap">
          <div class="tiles" id="tiles" role="group" aria-label="Девять изображений"></div>
          <div class="transition-overlay" id="transition-overlay" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20"/><path d="m14 24 7 7 13-15"/></svg>
            <span id="transition-text">Этап пройден</span>
          </div>
        </div>
        <div class="challenge-foot">
          <button type="button" id="refresh" class="refresh" title="Новое задание" aria-label="Обновить изображения">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-6v6h6M4 13a8 8 0 0 0 14 5l3-3m0 6v-6h-6"/></svg>
          </button>
          <span class="feedback" id="feedback" role="status" aria-live="polite"></span>
          <button type="button" id="verify" class="verify" disabled>
            <span class="verify-text" id="verify-text">Проверить</span>
            <svg class="verify-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg>
            <span class="verify-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </div>
  </main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const root = $('captcha');
  const start = $('start');
  const startLabel = $('start-label');
  const challenge = $('challenge');
  const tiles = $('tiles');
  const wrap = $('tiles-wrap');
  const verify = $('verify');
  const refresh = $('refresh');
  const feedback = $('feedback');
  const overlay = $('transition-overlay');
  const isDemo = true; // GitHub Pages: client-side only, no API
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  let current = null;
  let selected = new Set();
  let busy = false;
  let verified = false;
  let loadingRequest = false;
  const demo = { stage:1, current:null, lastTarget:null, verified:false };

  function shuffle(arr) {
    const copy = [...arr];
    for (let i=copy.length-1; i>0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [copy[i],copy[j]] = [copy[j],copy[i]];
    }
    return copy;
  }
  // Only the file:// preview uses local answers. On the Node.js server
  // the answer never arrives in the /api/challenge response.
  function makeDemoRound() {
    const icons = window.VECTRA_ICONS;
    const available = icons.filter(icon => icon.id !== demo.lastTarget);
    const targetIcon = shuffle(available)[0];
    const correctCount = 2 + Math.floor(Math.random()*3);
    const decoys = shuffle(icons.filter(icon=>icon.id !== targetIcon.id)).slice(0,9-correctCount);
    const layout = shuffle([...Array(correctCount).fill(targetIcon),...decoys]);
    const correct = layout.flatMap((icon,i)=>icon.id===targetIcon.id?[i]:[]);
    demo.lastTarget = targetIcon.id;
    demo.current = {id:String(Date.now())+'-'+Math.random(),stage:demo.stage,target:targetIcon.label,
      tiles:layout.map(icon=>({svg:icon.path})),correct};
    return {id:demo.current.id,stage:demo.stage,target:targetIcon.label,tiles:demo.current.tiles};
  }
  async function request(path, data) {
    if (isDemo) {
      await sleep(210);
      if (path==='/api/challenge') return demo.verified?{verified:true}:makeDemoRound();
      if (path==='/api/refresh') return makeDemoRound();
      if (path==='/api/submit') {
        if (!demo.current || data.id!==demo.current.id) return {ok:false,reason:'stale',challenge:makeDemoRound()};
        const good=selected.size===demo.current.correct.length && demo.current.correct.every(n=>selected.has(n));
        if (!good) return {ok:false,reason:'wrong',challenge:makeDemoRound()};
        if (demo.stage===1) {demo.stage=2;return {ok:true,done:false,challenge:makeDemoRound()};}
        demo.verified=true;return {ok:true,done:true};
      }
      throw new Error('Неизвестный запрос');
    }
    const opts={method:data?'POST':'GET',credentials:'same-origin',headers:{'Accept':'application/json'}};
    if (data) {opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data);}
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),10000);
    opts.signal=controller.signal;
    try {
      const response=await fetch(path,opts);
      const result=await response.json();
      if (!response.ok) throw new Error(result.message || 'Не удалось выполнить проверку');
      return result;
    } catch (error) {
      if (error.name==='AbortError') throw new Error('Сервер не ответил. Попробуйте ещё раз.');
      throw error;
    } finally {clearTimeout(timeout);}
  }

  function busyMode(on) {
    busy=on;
    root.classList.toggle('is-busy',on);
    verify.classList.toggle('loading',on && loadingRequest);
    start.disabled=on || verified;
    startLabel.disabled=on || verified;
    refresh.disabled=on || verified;
    verify.disabled=on || verified || !selected.size;
    tiles.querySelectorAll('button').forEach(b=>b.disabled=on || verified);
  }
  function setFeedback(message, isError=false) {
    feedback.textContent=message;
    feedback.classList.toggle('error',isError);
  }
  function showChallenge(open) {
    challenge.classList.toggle('open',open);
    challenge.inert=!open;
    challenge.setAttribute('aria-hidden',String(!open));
    start.setAttribute('aria-expanded',String(open));
    startLabel.setAttribute('aria-expanded',String(open));
  }
  function render(round, keepFeedback=false) {
    current=round;
    selected=new Set();
    if (!keepFeedback) setFeedback('');
    $('stage-number').textContent=String(round.stage).padStart(2,'0');
    $('stage-rail-fill').style.width=(round.stage===1?'50%':'100%');
    const target=$('target');
    target.textContent=round.target;
    target.style.animation='none';void target.offsetHeight;target.style.animation='';
    const fragment=document.createDocumentFragment();
    round.tiles.forEach((tile,index)=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='tile';
      button.style.setProperty('--tile-index',String(index));
      button.setAttribute('aria-pressed','false');
      button.setAttribute('aria-label',`Изображение ${index+1}`);
      // SVG markup is controlled by our static icon set on both client and server.
      button.innerHTML=`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${tile.svg}</svg><span class="tile-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 12 5 5 11-11"/></svg></span><span class="tile-nr" aria-hidden="true">${String(index+1).padStart(2,'0')}</span>`;
      button.addEventListener('click',()=>{
        if(busy || verified) return;
        if(selected.has(index)) selected.delete(index);else selected.add(index);
        const chosen=selected.has(index);
        button.classList.toggle('selected',chosen);
        button.setAttribute('aria-pressed',String(chosen));
        setFeedback('');
        verify.disabled=!selected.size;
      });
      fragment.appendChild(button);
    });
    tiles.replaceChildren(fragment);
    verify.disabled=true;
    if(busy)busyMode(true);
  }

  async function begin() {
    if(busy || verified || challenge.classList.contains('open'))return;
    loadingRequest=false;busyMode(true);
    try {
      const round=await request('/api/challenge');
      if(round.verified){complete();return;}
      render(round);
      showChallenge(true);
      busyMode(false);
    } catch(e) {
      busyMode(false);
      showChallenge(true);
      setFeedback(e.message || 'Сбой соединения',true);
    }
  }

  async function changeChallenge() {
    if(busy || verified)return;
    busyMode(true);
    refresh.querySelector('svg').style.transform='rotate(180deg)';
    try {
      const round=await request('/api/refresh',{});
      render(round);
      await sleep(130);
    } catch(e) {setFeedback(e.message,true);}
    finally {
      refresh.querySelector('svg').style.transform='';
      busyMode(false);
    }
  }
  function animateWrong() {
    wrap.classList.remove('is-error');void wrap.offsetWidth;
    wrap.classList.add('is-error');
    setTimeout(()=>wrap.classList.remove('is-error'),450);
  }
  function showOverlay(message){
    $('transition-text').textContent=message;
    overlay.classList.add('visible');
    overlay.setAttribute('aria-hidden','false');
  }
  function hideOverlay(){overlay.classList.remove('visible');overlay.setAttribute('aria-hidden','true');}
  function complete(){
    verified=true;
    root.classList.add('is-verified');
    root.classList.remove('is-busy');
    startLabel.textContent='Проверка пройдена';
    start.setAttribute('aria-label','Проверка пройдена');
    busyMode(false);
    showChallenge(false);
    try { sessionStorage.setItem('vectra_passed', 'yes'); } catch (_) {}
    setTimeout(async () => {
  try {
    const response = await fetch('./site.html');

    if (!response.ok) {
      throw new Error('Не удалось загрузить сайт');
    }

    const html = await response.text();

    document.open();
    document.write(html);
    document.close();

  } catch (error) {
    console.error(error);
    alert('Ошибка загрузки сайта');
  }
}, 900);
  }
  async function submit() {
    if(busy || verified || !current || !selected.size)return;
    loadingRequest=true;busyMode(true);
    verify.classList.add('loading');
    const started=performance.now();
    try {
      const result=await request('/api/submit',{id:current.id,selected:[...selected].sort((a,b)=>a-b)});
      const delay=Math.max(0,470-(performance.now()-started));
      if(delay)await sleep(delay);
      if(!result.ok){
        loadingRequest=false;verify.classList.remove('loading');
        animateWrong();
        if(result.challenge){
          await sleep(270);render(result.challenge,true);
        }
        setFeedback(result.reason==='too_fast'?'Не торопитесь.':
          result.reason==='expired'?'Время вышло. Новые изображения.':'Неверный выбор. Попробуйте ещё.',true);
        busyMode(false);return;
      }
      showOverlay(result.done?'Проверено':'Первый этап пройден');
      await sleep(result.done?780:720);
      if(result.done){complete();hideOverlay();return;}
      render(result.challenge);
      hideOverlay();
      loadingRequest=false;
      verify.classList.remove('loading');
      busyMode(false);
    } catch(e) {
      setFeedback(e.message || 'Ошибка проверки',true);
      loadingRequest=false;
      verify.classList.remove('loading');
      busyMode(false);
    }
  }
  start.addEventListener('click',begin);
  startLabel.addEventListener('click',begin);
  refresh.addEventListener('click',changeChallenge);
  verify.addEventListener('click',submit);
})();

</script>
</body>
